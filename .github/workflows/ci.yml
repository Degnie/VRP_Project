name: CI

on:
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Sin PostgreSQL/MongoDB/OSRM levantados en este pipeline — los tests
      # de integración que los necesitan se saltan solos (ADR-005,
      # metodología "skip if not present": DATABASE_URL/MONGO_URL/OSRM_URL
      # no están seteadas acá).
      - name: Run pytest
        run: pytest tests/

      - name: Check SPEC traceability
        run: python scripts/check_traceability.py

      # RNF-007: solo build, sin push a ningún registro — detecta si un
      # cambio en requirements.txt/package.json/Dockerfile rompe la imagen
      # antes de que se descubra en el momento de desplegar.
      - name: Build backend image
        run: docker build -f backend_python/Dockerfile -t vrp-backend .

      - name: Build frontend image
        run: docker build -t vrp-frontend frontend/
